<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>3PM STUDIO | PHOTO DOWNLOAD</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}*{box-sizing:border-box}body{margin:0;background:#faf8f8;color:#25181b;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);background:white;border:1px solid #f0e3e6;border-radius:24px;box-shadow:0 16px 50px #900d2415;padding:30px;text-align:center}.brand{color:#c91937;font-size:13px;letter-spacing:.22em;font-weight:900}.subtitle{font-size:14px;color:#776a6e;margin:10px 0 22px}.photo{display:block;width:100%;height:auto;max-height:500px;object-fit:contain;background:#f7f7f7;border-radius:12px}.button{display:block;width:100%;padding:16px;margin-top:12px;border:0;border-radius:12px;background:#cb1839;color:white;text-decoration:none;font-size:16px;font-weight:800;cursor:pointer}.button.alt{background:white;color:#cb1839;border:1px solid #cb1839}.hint{color:#71686a;font-size:12px;line-height:1.6;margin-top:20px}.hidden{display:none}.error{color:#b00020}</style></head>
<body><main class="card"><div class="brand">3PM STUDIO</div><h1>오늘의 순간을 간직하세요</h1><p class="subtitle" id="session">사진과 움직이는 GIF를 휴대폰에 저장하세요.</p><img id="photo" class="photo" alt="완성된 네컷 사진"><a id="jpgBtn" class="button" href="#">JPG 사진 저장</a><a id="gifBtn" class="button alt" href="#">움직이는 GIF 저장</a><p id="hint" class="hint">iPhone에서는 사진을 길게 눌러 '사진 앱에 저장'할 수도 있습니다.</p></main>
<script>
const API = "https://fpddmzdlbgojzhmyrmae.supabase.co/functions/v1/photo-download";
const params = new URLSearchParams(location.search);
const ticket = params.get("ticket");
const img = document.getElementById("photo");
const jpgBtn = document.getElementById("jpgBtn");
const gifBtn = document.getElementById("gifBtn");
const hint = document.getElementById("hint");
jpgBtn.classList.add("hidden"); gifBtn.classList.add("hidden"); img.classList.add("hidden");
function error(message) { hint.textContent = message; hint.classList.add("error"); }
async function init() {
  if (!ticket) { error("다운로드 링크가 없습니다. QR을 다시 스캔해주세요."); return; }
  try {
    const response = await fetch(API + "?ticket=" + encodeURIComponent(ticket), { cache: "no-store" });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(response.status === 403 ? "다운로드 링크가 만료되었거나 유효하지 않습니다." : "파일을 불러오지 못했습니다.");
    document.getElementById("session").textContent = "촬영번호 " + data.sessionId;
    img.src = data.jpg; img.classList.remove("hidden");
    jpgBtn.href = data.jpg; jpgBtn.classList.remove("hidden");
    gifBtn.href = data.gif; gifBtn.classList.remove("hidden");
    jpgBtn.download = "3PM_STUDIO_" + data.sessionId + ".jpg";
    gifBtn.download = "3PM_STUDIO_" + data.sessionId + ".gif";
    hint.textContent = "다운로드 링크는 촬영 후 7일간 유효합니다. iPhone에서는 사진을 길게 눌러 저장할 수도 있습니다.";
    for (const [button, url] of [[jpgBtn, data.jpg], [gifBtn, data.gif]]) {
      button.addEventListener("click", async (e) => {
        e.preventDefault();
        try {
          const r = await fetch(url);
          if (!r.ok) throw new Error("download");
          const blob = await r.blob();
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement("a"); a.href = blobUrl; a.download = button.download;
          document.body.append(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
        } catch { window.location.href = url; }
      });
    }
  } catch (e) { error(e.message || "다운로드 오류"); }
}
init();
</script></body></html>
